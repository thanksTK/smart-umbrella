</style></head><body><div class="shell"><header class="top"><div><div class="eyebrow">CS6750 · Individual Project</div><div class="brand">Smart Umbrella Prototype</div><div class="sub">A proposed SmartThings integration · Interactive usability study</div></div><button class="secondary" id="restartAll">Restart study</button></header><div class="layout"><aside class="panel" id="studyPanel"></aside><main class="phoneWrap"><div class="phone"><div class="phoneTop"><span>9:41</span><span>●●● ▰</span></div><div class="app" id="app"></div></div><div class="foot">Simulated app screens · No real device or weather connection</div></main></div><div class="footer">Student-designed concept for an HCI usability evaluation. Not affiliated with Samsung.</div></div>
<script>
'use strict';
// Paste the deployed Google Apps Script Web App URL here to enable central collection.
const COLLECTION_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzOvJaMB73fFwRi5me-kj7EBuUICHJgyXjerJNIZNLtlOtoDVLrZI1LlXwN-uP3k071/exec';
const tasks=[{id:'manual',title:'Manual registration',scenario:'You attached a compatible smart accessory to your umbrella. No new-device notification appeared. Add the umbrella to SmartThings.'},{id:'auto',title:'Automatic discovery',scenario:'Your phone has detected a new smart umbrella accessory. Use the notification to add it to SmartThings.'},{id:'details',title:'Umbrella details',scenario:'You are registering a large, black, non-folding umbrella with a curved handle. Enter its details and finish setup.'},{id:'rain',title:'Rainy-day recommendation',scenario:'Rain is expected today, and your umbrella is not nearby. Check what SmartThings tells you.'},{id:'left',title:'Left-behind reminder',scenario:'You are leaving the office. Your umbrella was last detected there. Check the alert and decide what it means.'}];
const s={task:-1,screen:'welcome',history:[],log:[],answers:{},umbrella:{name:'My Umbrella',type:'',size:'',color:'Black',handle:'',brand:''},chosen:false,started:Date.now(),taskStart:0,taskDone:{},attempts:{},notice:'',mode:'',participant:'',consent:false,submitted:false,submitting:false};
const $=id=>document.getElementById(id);const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function record(action,detail=''){s.log.push({timestamp:new Date().toISOString(),participantName:s.participant||'anonymous',task:s.task<0?'intro':tasks[s.task].id,screen:s.screen,action,detail});}
function go(screen){s.history.push(s.screen);s.screen=screen;record('navigate',screen);render();}
function back(){s.screen=s.history.pop()||'home';record('back');render();}
function setTask(i){s.task=i;s.history=[];s.taskStart=Date.now();s.attempts[tasks[i].id]=0;s.chosen=false;s.mode='';s.umbrella={name:'My Umbrella',type:'',size:'',color:'Black',handle:'',brand:'',};s.screen=i===0?'home':i===1?'home':i===2?'details':i===3?'rainStatus':'leftStatus';record('task_started',tasks[i].id);render();}
function completeTask(){if(s.task<0)return;const id=tasks[s.task].id;s.taskDone[id]={completed:true,seconds:Math.round((Date.now()-s.taskStart)/1000),attempts:s.attempts[id]||0};record('task_complete',JSON.stringify(s.taskDone[id]));s.screen='taskEnd';render();}
function wrong(label){if(s.task>=0)s.attempts[tasks[s.task].id]=(s.attempts[tasks[s.task].id]||0)+1;record('unavailable_tap',label);s.notice='This area is not part of the current prototype.';render();}
function btn(label,action,cls='primary'){return `<button class="${cls}" data-action="${action}">${label}</button>`}function appHead(title,backTo){return `<div class="appHeader smallhead"><button class="iconBtn" data-action="${backTo||'back'}" aria-label="Back">‹</button><h2>${title}</h2><div style="width:37px"></div></div>`}function card(icon,title,subtitle,action){return `<button class="menuBtn" data-action="${action}"><span>${icon}</span><span><b>${title}</b><br><span class="tiny">${subtitle||''}</span></span><span class="arrow">›</span></button>`}
function renderApp(){let a='';switch(s.screen){case 'welcome':a=`<div class="center"><div class="heroIcon">☂️</div><h2>Smart Umbrella</h2><p>Explore a proposed SmartThings feature for registering umbrellas and receiving useful reminders.</p><div class="hint">This is a simulated prototype. No Bluetooth device or location data is collected.</div><div class="appBottom">${btn('Begin study','begin','primary full')}</div></div>`;break;
case 'home':a=`<div class="appHeader"><h2>SmartThings</h2><button class="iconBtn" data-action="add" aria-label="Add device">+</button></div><div class="sectionTitle">Favorites</div><div class="deviceGrid"><div class="card tile"><div class="tileIcon">💡</div><div><strong>Living room</strong><span>Lights · On</span></div></div><div class="card tile"><div class="tileIcon">❄️</div><div><strong>Bedroom</strong><span>AC · Off</span></div></div><div class="card tile"><div class="tileIcon">🔒</div><div><strong>Front door</strong><span>Locked</span></div></div><div class="card tile"><div class="tileIcon">📺</div><div><strong>Living room</strong><span>TV · Off</span></div></div></div>${s.task===1?`<div class="banner" style="margin-top:26px"><div class="tile"><div class="tileIcon">☂️</div><div><strong>New device found</strong><span>Smart Umbrella detected nearby.</span></div></div><p>Do you want to add it?</p><div class="row">${btn('Not now','dismiss','secondary')}${btn('Add device','autoAdd')}</div></div>`:''}${s.task!==1?`<div class="sectionTitle">My devices</div>${card('💡','Living room lights','Connected','wrong:Living room lights')}`:''}`;break;
case 'add':a=appHead('Add device')+`<p class="small">Choose how to add a device.</p>${card('🔎','Scan nearby','Search for compatible devices','search')}${card('▦','Select device type','Browse available categories','categories')}`;break;
case 'categories':a=appHead('Select device type')+`<p class="small">Select a device type</p>${['Home appliances','Lighting','Security','Health','Energy','Entertainment'].map((x,i)=>card(['▣','💡','🔒','♥','🍃','📺'][i],x,'','wrong:'+x)).join('')}${card('☂️','Umbrella','Smart umbrella or accessory','search')}${card('⋯','Other','','wrong:Other')}`;break;
case 'search':a=appHead('Add umbrella')+`<div class="center"><div class="heroIcon">☂️</div><h3>Searching for umbrellas...</h3><p>Keep your umbrella or accessory near your phone.</p><div class="progress"><div></div></div></div>${card('☂️','Smart Umbrella','Accessory SU-2024-001 · Signal strong','connect')}`;break;
case 'connect':a=appHead('Connect umbrella')+`<div class="center"><div class="heroIcon">📱 · ☂️</div><h3>Connecting to Smart Umbrella...</h3><p>This may take a few seconds.</p><div class="progress"><div style="width:95%"></div></div><div class="appBottom">${btn('Continue','details','primary full')}</div></div>`;break;
case 'details':a=appHead('Umbrella details')+`<div class="field"><label for="umbName">Name *</label><input id="umbName" value="${escapeHtml(s.umbrella.name)}" maxlength="45"></div><div class="field"><label>Type *</label><div class="choices">${['Folding Umbrella','Non-Folding Umbrella'].map((v,i)=>`<button class="choice ${s.umbrella.type===v?'selected':''}" data-action="type:${v}"><span class="emoji">${i?'☂️':'🌂'}</span>${v}</button>`).join('')}</div></div><div class="field"><label>Size (optional)</label><div class="choices">${['Small','Medium','Large'].map(v=>`<button class="choice ${s.umbrella.size===v?'selected':''}" data-action="size:${v}">${v}</button>`).join('')}</div></div><div class="field"><label for="umbBrand">Brand (optional)</label><input id="umbBrand" placeholder="Enter brand" value="${escapeHtml(s.umbrella.brand)}"></div><div class="field"><label>Handle shape (optional)</label><div class="choices">${['Curved','Straight'].map(v=>`<button class="choice ${s.umbrella.handle===v?'selected':''}" data-action="handle:${v}">${v}</button>`).join('')}</div></div><div class="field"><label for="umbColor">Color (optional)</label><select id="umbColor">${['Black','Blue','Red','Yellow','Pink','Purple','Other'].map(v=>`<option ${s.umbrella.color===v?'selected':''}>${v}</option>`).join('')}</select></div>${s.notice?`<p class="error">${escapeHtml(s.notice)}</p>`:''}${btn('Save umbrella','save','primary full')}`;break;
case 'success':a=`<div class="center"><div class="success">✓</div><h2>Umbrella added!</h2><p>Your umbrella has been added to SmartThings.</p><div class="card tile" style="margin-top:32px"><div class="tileIcon">☂️</div><div><strong>${escapeHtml(s.umbrella.name)}</strong><span>${escapeHtml(s.umbrella.type)} · ${escapeHtml(s.umbrella.size||'Size not set')}</span></div></div>${btn('Done','finishRegistration','primary full')}</div>`;break;
case 'rainStatus':a=`<div class="appHeader"><h2>SmartThings</h2><button class="iconBtn" data-action="wrong:Plus">+</button></div><div class="banner"><div class="tile"><div class="tileIcon">🌧️</div><div><strong>Rain expected today</strong><span>Don't forget your umbrella.</span></div></div><p>Rain is forecast, but your umbrella is not currently detected nearby.</p></div><div class="sectionTitle">My devices</div><div class="card tile"><div class="tileIcon">☂️</div><div><strong>My Umbrella</strong><span>Not detected</span></div><span class="arrow">›</span></div><div class="hint">Device status: <b>Not detected</b><br>Suggested action: <b>Bring your umbrella</b></div><div class="appBottom">${btn('I understand this screen','finishStatus','primary full')}</div>`;break;
case 'leftStatus':a=`<div class="appHeader"><h2>SmartThings</h2><button class="iconBtn" data-action="wrong:Plus">+</button></div><div class="banner" style="background:#fff5ec;border-color:#ffe1c1"><div class="tile"><div class="tileIcon" style="background:#fff0dc">📍</div><div><strong>Did you leave your umbrella behind?</strong><span>Last seen at office · 2:15 PM</span></div></div><p>Your umbrella is no longer detected near your phone. Check before you leave.</p></div><div class="sectionTitle">My devices</div><div class="card tile"><div class="tileIcon">☂️</div><div><strong>My Umbrella</strong><span>Not detected · Last seen at office</span></div><span class="arrow">›</span></div><div class="hint">A lost connection does not necessarily mean the umbrella was forgotten.</div><div class="appBottom">${btn('I understand this screen','finishStatus','primary full')}</div>`;break;
case 'taskEnd':a=`<div class="center"><div class="success">✓</div><h2>Task complete</h2><p>You have finished this scenario. Return to the study panel to continue.</p><div class="card"><strong>${escapeHtml(tasks[s.task].title)}</strong><p class="small">Your interaction steps were recorded locally in this browser.</p></div>${btn(s.task===tasks.length-1?'Go to feedback':'Next task','nextTask','primary full')}</div>`;break;
case 'survey':a=`<div class="center"><div class="heroIcon">📝</div><h2>Feedback</h2><p>Please complete the short questionnaire in the study panel. Thank you for trying this concept.</p></div>`;break;}
$('app').innerHTML=a;document.querySelectorAll('#app [data-action]').forEach(el=>el.addEventListener('click',()=>handle(el.dataset.action)));if(s.screen==='details'){const name=$('umbName'),brand=$('umbBrand'),color=$('umbColor');name.addEventListener('input',()=>s.umbrella.name=name.value);brand.addEventListener('input',()=>s.umbrella.brand=brand.value);color.addEventListener('change',()=>{s.umbrella.color=color.value;record('select_color',color.value)})}}
function renderPanel(){let html='';if(s.task===-1&&s.screen==='welcome'){html=`<span class="stepbadge">Study introduction</span><h1>Try a smart umbrella concept</h1><p>Explore how an umbrella might be added to SmartThings and how weather-based reminders could work.</p><div class="scenario"><strong>Before you begin</strong><br>• This is a student-designed simulation, not a real SmartThings feature.<br>• Participation is voluntary; you may stop at any time.<br>• No personal location or device information is collected.<br>• Your name and responses will be sent to the researcher if online collection is enabled; otherwise you can export them locally.</div><div class="field"><label for="pid">Participant name *</label><input id="pid" placeholder="Your name" autocomplete="name" maxlength="80" required value="${escapeHtml(s.participant)}"></div><label style="display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.5"><input id="consent" type="checkbox" ${s.consent?'checked':''}> I agree to participate and understand that my name, task interactions, and survey answers may be collected by the researcher if online collection is enabled.</label><div style="margin-top:18px">${btn('Start the study','begin','primary full')}</div>`}
else if(s.screen==='survey'){html=`<span class="stepbadge">Final step</span><h1>Quick feedback</h1><p>Rate the design based on the tasks you tried. 1 = strongly disagree, 5 = strongly agree.</p>${[['ease','It was easy to add an umbrella.'],['details','The umbrella details were easy to understand.'],['status','The status messages were clear.'],['useful','Weather-based reminders would be useful.']].map(([k,t])=>`<div class="surveyRow"><label for="q_${k}">${t}</label><select id="q_${k}"><option value="">Choose a rating</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${s.answers[k]==n?'selected':''}>${n}</option>`).join('')}</select></div>`).join('')}<div class="surveyRow"><label for="q_comments">What would you change?</label><textarea id="q_comments" placeholder="Optional comments">${escapeHtml(s.answers.comments||'')}</textarea></div><div class="row">${btn('Submit feedback','submitSurvey')}${btn('Export backup','export','secondary')}</div><div id="surveyMessage" class="small" style="margin-top:12px"></div><hr class="divider"><p class="note">${COLLECTION_ENDPOINT ? "When you submit, your name, task interactions and answers are sent to the researcher’s Google Sheet. Export backup is optional. Submission delivery cannot be verified automatically; contact the researcher if unsure." : "Online collection is not configured yet. Use Export backup to download your responses and send the file to the researcher. The researcher must configure the collection endpoint before sharing this study."}</p>`}
else{let t=tasks[s.task];html=`<span class="stepbadge">Task ${s.task+1} of ${tasks.length}</span><h1>${escapeHtml(t.title)}</h1><p>Read the scenario, then use the simulated phone to complete the task.</p><div class="scenario"><div class="labelTag">Scenario</div>${escapeHtml(t.scenario)}</div><p class="note">Please try without asking for help. You can describe what you expect to happen while using the interface.</p><div class="row">${btn('Restart this task','restartTask','secondary')}${btn('Skip task','skipTask','secondary')}</div><hr class="divider"><h2>Study tasks</h2><div class="taskList">${tasks.map((x,i)=>`<button class="taskItem ${i===s.task?'active':''} ${s.taskDone[x.id]?'done':''}" data-task="${i}">${i+1}. ${escapeHtml(x.title)}</button>`).join('')}</div><hr class="divider"><div class="row">${btn('Finish study','toSurvey','secondary')}${btn('Export session','export','secondary')}</div><p class="note">Task interactions are saved in this browser session only. A facilitator may note any hesitation or confusion separately.</p>`}
$('studyPanel').innerHTML=html;document.querySelectorAll('#studyPanel [data-action]').forEach(el=>el.addEventListener('click',()=>handle(el.dataset.action)));document.querySelectorAll('#studyPanel [data-task]').forEach(el=>el.addEventListener('click',()=>setTask(Number(el.dataset.task))));if($('pid'))$('pid').addEventListener('input',e=>s.participant=e.target.value);if($('consent'))$('consent').addEventListener('change',e=>s.consent=e.target.checked)}
function render(){renderApp();renderPanel()}
function handle(action){record('click',action);s.notice='';if(action==='begin'){if(!s.participant.trim()){alert('Please enter your name.');$('pid')?.focus();return;}if(!s.consent){if($('consent')){$('consent').focus();alert('Please confirm that you agree to participate.');}else alert('Please confirm participation on the study panel.');return;}setTask(0);return}if(action==='restartTask'){setTask(s.task);return}if(action==='skipTask'){record('task_skipped');nextTask();return}if(action==='nextTask'){nextTask();return}if(action==='toSurvey'){s.screen='survey';render();return}if(action==='submitSurvey'){submitSurvey();return}if(action==='export'){exportData();return}if(action==='back'){back();return}if(action==='add'){go('add');return}if(action==='categories'){go('categories');return}if(action==='search'){go('search');return}if(action==='autoAdd'){s.mode='auto';go('search');return}if(action==='dismiss'){record('dismiss_discovery');s.notice='Discovery notification dismissed.';render();return}if(action==='connect'){go('connect');return}if(action==='details'){go('details');return}if(action.startsWith('type:')||action.startsWith('size:')||action.startsWith('handle:')){const [key,...v]=action.split(':');s.umbrella[key]=v.join(':');record('select_'+key,s.umbrella[key]);render();return}if(action==='save'){if(!s.umbrella.name.trim()||!s.umbrella.type){s.notice='Please enter a name and choose an umbrella type.';render();return}record('umbrella_saved',JSON.stringify(s.umbrella));go('success');return}if(action==='finishRegistration'||action==='finishStatus'){completeTask();return}if(action.startsWith('wrong:')){wrong(action.slice(6));return}}
function nextTask(){if(s.task<tasks.length-1){setTask(s.task+1)}else{s.screen='survey';render()}}
function saveSurvey(){for(const k of ['ease','details','status','useful']){s.answers[k]=$('q_'+k).value} s.answers.comments=$('q_comments').value;record('survey_saved');$('surveyMessage').textContent='Feedback prepared. Use Submit feedback to send it to the researcher.';}
function resultPayload(){return {study:'Smart Umbrella HCI prototype',participantName:s.participant.trim(),submittedAt:new Date().toISOString(),consent:s.consent,taskResults:s.taskDone,feedback:s.answers,interactions:s.log,disclaimer:'Simulated prototype; participant-provided name.'};}
async function submitSurvey(){
  if(s.submitting)return;
  saveSurvey();
  if(!s.participant.trim()||!s.consent){$('surveyMessage').textContent='A name and consent are required.';return;}
  if(!COLLECTION_ENDPOINT){$('surveyMessage').textContent='Online collection has not been configured. Please use Export backup and send it to the researcher.';return;}
  if(s.submitted){$('surveyMessage').textContent='A submission was already attempted. Please ask the researcher to confirm receipt before submitting again.';return;}
  s.submitting=true;
  $('surveyMessage').textContent='Sending feedback...';
  try {
    // Apps Script Web Apps do not expose CORS response headers. no-cors sends the
    // request but cannot confirm server-side storage; do not claim verified success.
    await fetch(COLLECTION_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(resultPayload())});
    s.submitted=true;
    $('surveyMessage').textContent='Submission sent. Delivery cannot be confirmed in this browser. You may export a backup; ask the researcher to verify receipt.';
  }catch(err){
    $('surveyMessage').textContent='Could not send feedback. Please export a backup and share it with the researcher.';
  }finally{s.submitting=false;}
}
function exportData(){if(s.screen==='survey')saveSurvey();const data=resultPayload();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='smart_umbrella_'+(s.participant.replace(/[^a-z0-9_-]/gi,'')||'anonymous')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
$('restartAll').addEventListener('click',()=>{if(confirm('Restart the study? Current unsaved results will be lost.'))location.reload()});render();
</script></body></html>
